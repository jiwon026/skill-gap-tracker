# 훈련과정 검색 조건 (2026-09-16 실측 기준).
#
# 고용24 목록 API 는 한 번에 100회차까지만 준다. 넓은 검색어는 회차가 수천이라
# 첫 페이지만 보면 한쪽으로 쏠린다. pages 만큼 읽은 뒤 과정 단위로 묶는다.
window_days: 90          # 오늘부터 며칠 안에 시작하는 과정까지
min_demand: 2            # 모집중 공고 이 수 이상이 요구하는 부족 스킬만
per_skill: 5             # 스킬 하나당 올릴 과정 수
pages: 3                 # 검색어 하나당 읽을 페이지 수 (100회차 단위)
list_cache_days: 7       # 목록 캐시. 과정 목록은 매일 바뀌지 않는다
detail_cache_days: 30    # 본인부담액 캐시

# 주소가 이 중 하나로 시작하면 수도권으로 본다. 원격 과정은 지역과 무관하게 통과.
metro_prefixes: [서울, 경기, 인천]

# 재직자 대상 과정. 구직자는 들을 수 없다.
# 실업자원격훈련은 구직자용이라 제외하지 않는다.
exclude_targets: [근로자원격훈련]

# 제목에 이 말이 있으면 재직자용이다(K-디지털 트레이닝에 섞여 있다).
exclude_title_words: [재직자]
