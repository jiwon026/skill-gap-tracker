# 자체 채용 API. 목록에 본문이 없어 공고마다 상세를 한 번 더 부른다.
# 국내 이커머스 대기업 중 공개 JSON API가 안정적으로 열려 있는 드문 경우다.
woowahan:
  - company: 우아한형제들
    domain: ecommerce
    enabled: true       # 53건 (전 직군)

# 사람인 오픈API. 국내 중견·대기업 커버리지의 주력 소스다.
# SARAMIN_ACCESS_KEY 환경변수가 없으면 경고만 남기고 통째로 건너뛴다.
# 하루 500콜 제한이 있어 키워드 수를 함부로 늘리면 안 된다.
saramin:
  - keyword: 데이터 분석
    domain: ecommerce
    enabled: true
  - keyword: 데이터 분석가
    domain: ecommerce
    enabled: true
  - keyword: 프로덕트 애널리스트
    domain: ecommerce
    enabled: true
  - keyword: 그로스 분석
    domain: ecommerce
    enabled: false      # 표본이 필요할 때만 켠다. 콜 예산이 빠듯하다
