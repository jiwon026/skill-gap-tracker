# 대상 경력 수준: 신입·인턴 (2026-09-09 결정).
#
# 판정 재료가 소스마다 다르다.
#   우아한형제들  careerRestrictionMinYears (예: 3) — 정확하다
#   사람인        experience-level.min      (예: 3) — 정확하다
#   Greenhouse    없음 — 본문 '자격 요건' 섹션의 "N년 이상"을 읽는다
#
# 믿을 만한 순서대로 본다.
#   소스가 준 숫자 > 제목의 신입 표기 > 본문 자격요건의 연수 > 제목의 직급 표기
# 본문 단계가 없던 때 쿠팡 공고 7건이 전부 2~5년 경력직인데 통과했다.

#: 최소 요구 경력이 이 값을 넘으면 제외한다. 신입 대상이므로 1년.
#: '경력 1~3년'처럼 하한이 1이면 신입 지원이 열려 있는 경우가 많아 남긴다.
max_years: 1

#: 제목에 이게 있으면 제외한다. 숫자 정보가 없는 소스(Greenhouse)의 유일한 단서다.
senior_markers:
  - Senior
  - Sr.
  - Staff
  - Principal
  - Director
  - Head of
  - Lead
  - Manager
  - VP
  - Chief
  - 시니어
  - 리더
  - 리더급
  - 팀장
  - 실장
  - 책임
  - 수석

#: 이게 있으면 senior_markers 를 무시하고 통과시킨다.
#: '신입/경력' 동시 채용처럼 직급 표기가 있어도 신입이 지원 가능한 경우다.
#: 숫자(max_years) 판정은 이것으로 뒤집지 않는다 — 숫자가 더 믿을 만하다.
junior_markers:
  - 신입
  - 인턴
  - Intern
  - Junior
  - Jr.
  - 주니어
  - 신입가능
  - 경력무관
  - 무관
  - 대졸
  - 신입/경력
