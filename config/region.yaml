# 지원 지역: 수도권 (2026-09-10 결정).
#
# 판정 순서 — 제목의 지역 표기 > 지역 필드 > 모르면 통과.
#   제목을 먼저 보는 이유: 지역 필드에 본사 주소가 들어오는 공고가
#   있다('…, 부산' 공고의 지역 필드가 서울 강남구였다).
#   모르면 통과하는 이유: 우아한형제들은 근무지를 아예 주지 않는다('대한민국'),
#   Greenhouse 도 'South Korea'로만 적은 공고가 있다.
#
# 제목에서는 지역명이 독립된 단어일 때만 센다. '제주항공', 'BNK부산은행',
# '서울대학교'의 지역명은 근무지가 아니다. 지역 필드에서는 부분 일치로
# 찾는다('서울특별시', '부산광역시').
#
# include 가 exclude 보다 먼저다. '경기 광주시'는 수도권이고 '광주광역시'는
# 아니다 — '경기'가 함께 적혀 있으면 수도권으로 본다.

include:
  - 서울
  - 경기
  - 인천
  - Seoul
  - Gyeonggi
  - Incheon

exclude:
  - 부산
  - 대구
  - 광주
  - 대전
  - 울산
  - 세종
  - 강원
  - 충북
  - 충남
  - 충청
  - 전북
  - 전남
  - 전라
  - 경북
  - 경남
  - 경상
  - 제주
  - Busan
  - Daegu
  - Gwangju
  - Daejeon
  - Ulsan
  - Sejong
  - Gangwon
  - Jeju
